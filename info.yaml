# Tiny Tapeout project information
project:
  title:        "Talos: 16 Neuron Spiking Neuromorphic Reservoir"      # Project title
  author:       "Ivan"      # Your name
  discord:      "kazenowoko"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "16 Neuron event-driven recurrent spiking reservoir (i.e Liquid State Machine) with ternary synapses"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     16000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_kazenoko_talos"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "spi_slave.v"
    - "reg_file.v"
    - "lif_neuron.v"
    - "spiking_reservoir.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "sclk"
  ui[1]: "mosi"
  ui[2]: "cs_n"
  ui[3]: "ext_tick"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "miso"
  uo[1]: "spike[0]"
  uo[2]: "spike[1]"
  uo[3]: "spike[2]"
  uo[4]: "spike[3]"
  uo[5]: "spike[4]"
  uo[6]: "spike[5]"
  uo[7]: "spike[6]"

  # Bidirectional pins
  uio[0]: "spike[7]"
  uio[1]: "spike[8]"
  uio[2]: "spike[9]"
  uio[3]: "spike[10]"
  uio[4]: "spike[11]"
  uio[5]: "spike[12]"
  uio[6]: "spike[13]"
  uio[7]: "spike[14]"

# Do not change!
yaml_version: 6
